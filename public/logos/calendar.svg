<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="calendar-base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8BB4F7"/>
      <stop offset="100%" stop-color="#4285F4"/>
    </linearGradient>
    <linearGradient id="calendar-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C2E7FF"/>
      <stop offset="100%" stop-color="#A8C7FA"/>
    </linearGradient>
  </defs>
  
  <!-- Top Flap -->
  <path d="M 52,60 C 100,30 156,30 204,60 L 210,80 C 156,60 100,60 46,80 Z" fill="url(#calendar-top)"/>
  
  <!-- Main Body -->
  <path d="M 40,75 C 100,55 156,55 216,75 C 220,130 220,180 212,210 C 208,225 190,230 176,230 L 80,230 C 66,230 48,225 44,210 C 36,180 36,130 40,75 Z" fill="url(#calendar-base)"/>
  
  <!-- The number 31 -->
  <text x="128" y="180" font-family="'Google Sans', Roboto, Arial, sans-serif" font-size="110" font-weight="500" letter-spacing="-5" text-anchor="middle" fill="#FFFFFF">31</text>
